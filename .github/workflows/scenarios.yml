name: Scenarios

on:
  schedule:
    # 07:00 UTC, the middle of the night in the US
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      fpp_ref:
        description: fpp branch, tag or commit to test
        default: master
      flavor:
        description: Build flavor
        type: choice
        options: [asan, tsan, coverage, debug, optimized]
        default: asan
      pytest_args:
        description: Extra pytest arguments (e.g. -k presets)
        default: ""
      suites:
        description: Which suites to run
        type: choice
        options: [all, scenarios, web]
        default: all
      playwright_args:
        description: Extra playwright arguments for the web UI suite (e.g. -g Playlists)
        default: ""
      publish:
        description: Add this run to the dashboard on GitHub Pages (coverage of fpp master only)
        type: boolean
        default: false
  # A pull request to this repo runs the suite against fpp master, so a
  # contributor can add a scenario without Docker or an FPP device.
  pull_request:
  # Lets an fpp workflow ask for a run:
  #   gh api repos/FalconChristmas/fpp-tests/dispatches \
  #     -f event_type=fpp-push -F client_payload[ref]=<sha>
  repository_dispatch:
    types: [fpp-push]

concurrency:
  group: scenarios-${{ github.event.pull_request.number || '' }}-${{ github.event.inputs.fpp_ref || github.event.client_payload.ref || 'master' }}-${{ github.event.inputs.flavor || 'asan' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scenarios:
    if: github.event.inputs.suites != 'web'
    runs-on: ubuntu-latest
    # TSan runs fppd several times slower than ASan, and the coverage build
    # is unoptimized.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # The nightly run checks both memory errors (ASan) and data races
        # (TSan, with the known races in sanitizers/tsan.supp), and measures
        # what the scenarios reach (coverage: -O0, no sanitizer). Everything
        # else runs the one flavor it asked for.
        flavor: ${{ fromJSON(github.event_name == 'schedule' && '["asan","tsan","coverage"]' || format('["{0}"]', github.event.inputs.flavor || 'asan')) }}
    env:
      FPP_REF: ${{ github.event.inputs.fpp_ref || github.event.client_payload.ref || 'master' }}
      FLAVOR: ${{ matrix.flavor }}
    steps:
      - name: Checkout fpp-tests
        uses: actions/checkout@v6

      - name: Checkout fpp
        uses: actions/checkout@v6
        with:
          repository: FalconChristmas/fpp
          ref: ${{ env.FPP_REF }}
          path: fpp
          # Full history without blobs: enough for `git describe` to name the
          # version, without downloading every file ever committed.
          fetch-depth: 0
          filter: blob:none

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-${{ env.FLAVOR }}-${{ github.run_id }}
          restore-keys: ccache-${{ env.FLAVOR }}-

      - name: Build fpp and run scenarios
        env:
          FPP_TESTS_CCACHE: .ccache
          PYTEST_ARGS: ${{ github.event.inputs.pytest_args }}
          # A NOPCH build failure fails the run, except for an fpp ref asked
          # for by hand, which may be an old commit that needs the PCH.
          NOPCH: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.fpp_ref == 'master') && '--nopch' || '' }}
        # PYTEST_ARGS is left unquoted on purpose, to split into arguments.
        run: ./run.sh --fpp fpp --ref HEAD --flavor "$FLAVOR" $NOPCH -v -rA $PYTEST_ARGS

      # The container writes the artifacts as root, some of them unreadable
      # to the runner user that uploads them.
      - name: Make the artifacts readable
        if: always()
        run: |
          mkdir -p artifacts
          sudo chown -R "$(id -u):$(id -g)" artifacts && chmod -R u+rwX artifacts
          version=$(git -C fpp describe --tags --match='[0-9]*' 2>/dev/null || git -C fpp rev-parse --short HEAD)
          printf '{"flavor":"%s","version":"%s","sha":"%s"}\n' "$FLAVOR" "$version" \
            "$(git -C fpp rev-parse HEAD)" > artifacts/meta.json

      - name: Upload failed scenarios
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-scenarios-${{ env.FLAVOR }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the coverage report
        id: coverage
        if: always() && env.FLAVOR == 'coverage'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: artifacts/coverage/
          if-no-files-found: ignore
          retention-days: 30

      - name: Summarize
        if: always()
        run: python3 scripts/ci-summary.py artifacts "${{ steps.coverage.outputs.artifact-url }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-${{ env.FLAVOR }}
          path: |
            artifacts/meta.json
            artifacts/junit.xml
            artifacts/coverage/totals.json
          if-no-files-found: ignore
          retention-days: 14

  # The web UI suite (web/, run-web.sh): fpp's pages served from Docker as on a
  # player, with the ASan fppd behind them, driven by Playwright from the
  # runner. A dispatched flavor is the fppd behind the pages, except coverage,
  # which has no web counterpart and runs it with ASan (so a hand-published
  # dashboard still gets the web column).
  web:
    if: github.event.inputs.suites != 'scenarios'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FPP_REF: ${{ github.event.inputs.fpp_ref || github.event.client_payload.ref || 'master' }}
      FLAVOR: ${{ github.event.inputs.flavor != '' && github.event.inputs.flavor != 'coverage' && github.event.inputs.flavor || 'asan' }}
    steps:
      - name: Checkout fpp-tests
        uses: actions/checkout@v6

      - name: Checkout fpp
        uses: actions/checkout@v6
        with:
          repository: FalconChristmas/fpp
          ref: ${{ env.FPP_REF }}
          path: fpp
          fetch-depth: 0
          filter: blob:none

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-web-${{ env.FLAVOR }}-${{ github.run_id }}
          restore-keys: |
            ccache-web-${{ env.FLAVOR }}-
            ccache-${{ env.FLAVOR }}-

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the suite and Chromium
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Build fpp, serve the UI and run the suite
        env:
          FPP_TESTS_CCACHE: .ccache
          PLAYWRIGHT_ARGS: ${{ github.event.inputs.playwright_args }}
          NOPCH: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.fpp_ref == 'master') && '--nopch' || '' }}
        # PLAYWRIGHT_ARGS is left unquoted on purpose, to split into arguments.
        run: ./run-web.sh --fpp fpp --ref HEAD --flavor "$FLAVOR" $NOPCH $PLAYWRIGHT_ARGS

      # meta.json's flavor is the dashboard's column for this suite.
      - name: Make the artifacts readable
        if: always()
        run: |
          mkdir -p artifacts/web
          sudo chown -R "$(id -u):$(id -g)" artifacts && chmod -R u+rwX artifacts
          version=$(git -C fpp describe --tags --match='[0-9]*' 2>/dev/null || git -C fpp rev-parse --short HEAD)
          printf '{"flavor":"web","fppd":"%s","version":"%s","sha":"%s"}\n' "$FLAVOR" "$version" \
            "$(git -C fpp rev-parse HEAD)" > artifacts/web/meta.json

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-report
          path: artifacts/web/
          if-no-files-found: ignore
          retention-days: 14

      - name: Summarize
        if: always()
        run: python3 scripts/ci-summary.py artifacts/web >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-web
          path: |
            artifacts/web/meta.json
            artifacts/web/junit.xml
          if-no-files-found: ignore
          retention-days: 14

  # The dashboard on GitHub Pages: the test counts and coverage of every run
  # so far (history.json, carried over from the live site each time) and the
  # latest coverage report, line by line. Each deploy replaces the whole site,
  # so only a run with a coverage build publishes by hand.
  publish:
    needs: [scenarios, web]
    if: always() && !cancelled() && (github.event_name == 'schedule' || (github.event.inputs.publish == 'true' && github.event.inputs.fpp_ref == 'master' && github.event.inputs.flavor == 'coverage'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Checkout fpp-tests
        uses: actions/checkout@v6

      - name: Download the results
        uses: actions/download-artifact@v8
        with:
          pattern: results-*
          path: results

      - name: Download the coverage report
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: coverage-report
          path: site/coverage

      - name: Build the dashboard
        run: |
          curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/history.json" \
            -o history.json || echo "no published history yet"
          python3 scripts/build-site.py results site history.json \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          rm -f site/coverage/coverage.json

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5
