name: Scenarios

on:
  schedule:
    # 07:00 UTC, the middle of the night in the US
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      fpp_ref:
        description: fpp branch, tag or commit to test
        default: master
      flavor:
        description: Build flavor
        type: choice
        options: [asan, tsan, coverage, debug, optimized]
        default: asan
      pytest_args:
        description: Extra pytest arguments (e.g. -k presets)
        default: ""
      suites:
        description: Which suites to run
        type: choice
        options: [all, scenarios, web]
        default: all
      playwright_args:
        description: Extra playwright arguments for the web UI suite (e.g. -g Playlists)
        default: ""
      publish:
        description: Add this run to the dashboard on GitHub Pages (coverage of fpp master only)
        type: boolean
        default: false
      device:
        description: Also run the device scenarios on the Pi 5 and the AM62x Beagle (needs flavor asan, whose skips pick them)
        type: boolean
        default: false
  # A pull request to this repo runs the suite against fpp master, so a
  # contributor can add a scenario without Docker or an FPP device.
  pull_request:
  # Lets an fpp workflow ask for a run:
  #   gh api repos/FalconChristmas/fpp-tests/dispatches \
  #     -f event_type=fpp-push -F client_payload[ref]=<sha>
  repository_dispatch:
    types: [fpp-push]

concurrency:
  group: scenarios-${{ github.event.pull_request.number || '' }}-${{ github.event.inputs.fpp_ref || github.event.client_payload.ref || 'master' }}-${{ github.event.inputs.flavor || 'asan' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scenarios:
    if: github.event.inputs.suites != 'web'
    runs-on: ubuntu-latest
    # TSan runs fppd several times slower than ASan, and the coverage build
    # is unoptimized. A whole ASan or TSan run takes longer than a hosted
    # runner's job may (360 minutes), so each runs as four shards side by side
    # (scripts/shard.py) and the results job puts them back together.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        # The nightly run checks both memory errors (ASan) and data races
        # (TSan, with the known races in sanitizers/tsan.supp), and measures
        # what the scenarios reach (coverage: -O0, no sanitizer). Everything
        # else runs the one flavor it asked for.
        flavor: ${{ fromJSON(github.event_name == 'schedule' && '["asan","tsan","coverage"]' || format('["{0}"]', github.event.inputs.flavor || 'asan')) }}
        # A dispatch with its own pytest arguments may name files, so it runs
        # whole, in one job.
        shard: ${{ fromJSON(github.event.inputs.pytest_args != '' && github.event.inputs.pytest_args != null && '[1]' || '[1,2,3,4]') }}
    env:
      FPP_REF: ${{ github.event.inputs.fpp_ref || github.event.client_payload.ref || 'master' }}
      FLAVOR: ${{ matrix.flavor }}
      SHARD: ${{ matrix.shard }}
      SHARDS: ${{ (github.event.inputs.pytest_args != '' && github.event.inputs.pytest_args != null) && '1' || '4' }}
    steps:
      - name: Checkout fpp-tests
        uses: actions/checkout@v6

      - name: Checkout fpp
        uses: actions/checkout@v6
        with:
          repository: FalconChristmas/fpp
          ref: ${{ env.FPP_REF }}
          path: fpp
          # Full history without blobs: enough for `git describe` to name the
          # version, without downloading every file ever committed.
          fetch-depth: 0
          filter: blob:none

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-${{ env.FLAVOR }}-${{ github.run_id }}-${{ matrix.shard }}
          restore-keys: ccache-${{ env.FLAVOR }}-

      - name: Build fpp and run scenarios
        env:
          FPP_TESTS_CCACHE: .ccache
          PYTEST_ARGS: ${{ github.event.inputs.pytest_args }}
          # A NOPCH build failure fails the run, except for an fpp ref asked
          # for by hand, which may be an old commit that needs the PCH.
          NOPCH: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.fpp_ref == 'master') && '--nopch' || '' }}
        # PYTEST_ARGS and FILES are left unquoted on purpose, to split into
        # arguments.
        run: |
          FILES=
          if [ "$SHARDS" -gt 1 ]; then
            FILES=$(python3 scripts/shard.py "$SHARD" "$SHARDS")
          fi
          ./run.sh --fpp fpp --ref HEAD --flavor "$FLAVOR" $NOPCH -v -rA $PYTEST_ARGS $FILES

      # The container writes the artifacts as root, some of them unreadable
      # to the runner user that uploads them.
      - name: Make the artifacts readable
        if: always()
        run: |
          mkdir -p artifacts
          sudo chown -R "$(id -u):$(id -g)" artifacts && chmod -R u+rwX artifacts
          version=$(git -C fpp describe --tags --match='[0-9]*' 2>/dev/null || git -C fpp rev-parse --short HEAD)
          printf '{"flavor":"%s","version":"%s","sha":"%s"}\n' "$FLAVOR" "$version" \
            "$(git -C fpp rev-parse HEAD)" > artifacts/meta.json

      - name: Upload failed scenarios
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-scenarios-${{ env.FLAVOR }}-${{ matrix.shard }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

      # One shard's report covers only its quarter; the results job merges
      # the shards' counts (coverage.json) into the report.
      - name: Upload the coverage report
        id: coverage
        if: always() && env.FLAVOR == 'coverage' && env.SHARDS == '1'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: artifacts/coverage/
          if-no-files-found: ignore
          retention-days: 30

      - name: Summarize
        if: always()
        run: python3 scripts/ci-summary.py artifacts "${{ steps.coverage.outputs.artifact-url }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the shard's results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shard-${{ env.FLAVOR }}-${{ matrix.shard }}
          path: |
            artifacts/meta.json
            artifacts/junit.xml
            artifacts/coverage/totals.json
            artifacts/coverage/coverage.json
          if-no-files-found: ignore
          retention-days: 14

  # The scenarios only a device can run, on real hardware through
  # run-local.sh: the ones the last nightly's ASan run skipped
  # (scripts/device-tests.py; taken from the previous night so this runs
  # beside the shards instead of after them). On a Raspberry Pi 5: Pi
  # fppinit and cape detection, DPI pixels, framebuffer and KMS outputs,
  # GPIO, the serial console, the real sound card (--host-audio). On an
  # AM62x BeagleBone (a PocketBeagle2 with a cape): the BB64 cape
  # detection, its PRU outputs against the FAKE_PRU mode run-local.sh puts
  # it in, GPIO and the cape's sound card. Each picks its own from the one
  # list; the rest skip. On the same fpp ref as the shards. The Pi's is a
  # coverage build, the Pi's and the Beagle's: their counters join the
  # Docker shards' in the coverage report, so the code only a device reaches
  # is counted. The Beagle's compiles through nocc (scripts/device-make.sh).
  # Self-hosted, where a job is root on the device, so never for a pull
  # request: only the nightly and a run by hand that asks for it. Each
  # runner carries its device's label.
  device:
    if: github.event_name == 'schedule' || github.event.inputs.device == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: pi5
            timeout: 120
          # host_pru: the scenarios that drive the real PRUs take a second
          # pass (scripts/device-scenarios.sh)
          - device: am62x
            host_pru: true
            timeout: 180
    runs-on:
      group: Devices
      labels: [self-hosted, Linux, ARM64, "${{ matrix.device }}"]
    timeout-minutes: ${{ matrix.timeout }}
    concurrency:
      group: device-${{ matrix.device }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    env:
      FPP_REF: ${{ github.event.inputs.fpp_ref || 'master' }}
    steps:
      # run-local.sh runs as root; anything of root's left in the workspace
      # (a crashed run's files) would stop the checkout from cleaning it.
      - name: Give the workspace back to the runner
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" || true

      - name: Checkout fpp-tests
        uses: actions/checkout@v6

      - name: Pick the scenarios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/last-asan-results.py last-asan.xml
          python3 scripts/device-tests.py last-asan.xml > device-tests.txt
          echo "$(wc -l < device-tests.txt) scenarios that ASan run skipped"

      - name: Checkout fpp
        uses: actions/checkout@v6
        with:
          repository: FalconChristmas/fpp
          ref: ${{ env.FPP_REF }}
          path: fpp
          fetch-depth: 0
          filter: blob:none
          # A device build needs them (RGBMatrix, RF24, spixels), and make -j
          # left to fetch them itself races two clones of one submodule.
          submodules: recursive

      # The coverage flavor, as build-fpp.sh makes it in Docker
      # (scripts/device-make.sh). The checkout cleans the tree each night;
      # ccache (the runner user's own, and the shared remote cache its
      # ccache.conf names) makes the rebuild cheap.
      - name: Build fpp
        working-directory: fpp/src
        env:
          CCACHE: ccache
          CCACHE_BASEDIR: ${{ github.workspace }}/fpp
          CCACHE_NOHASHDIR: "1"
        run: ../../scripts/device-make.sh coverage

      # The run has the device to itself: the device's own fppd holds its
      # outputs' GPIO lines (a cape's string pins, which the BB output
      # scenarios drive) and fppoled the cape buttons' (test_gpio_pins).
      # Started again at the end, however the job ends.
      - name: Stop the device's fppd and fppoled
        run: |
          restart=
          for s in fppd fppoled; do
            if systemctl is-active --quiet $s; then
              sudo systemctl stop $s
              restart="$restart $s"
            fi
          done
          echo "RESTART_SERVICES=$restart" >> "$GITHUB_ENV"

      # The test fppd writes its counters through run-local.sh's overlay of
      # the tree, where they would vanish with it: GCOV_PREFIX puts them in
      # gcov/ instead, under each object's full path. No bytecode: as root it
      # would land in a scenarios/__pycache__ the runner cannot remove. The
      # node ids go in a file (pytest's @file), one per line, since some
      # carry spaces in their parameters.
      - name: Run the scenarios
        run: |
          sudo env PYTHONDONTWRITEBYTECODE=1 GCOV_PREFIX="$PWD/gcov" HOST_PRU=${{ matrix.host_pru && '1' || '' }} \
            scripts/device-scenarios.sh --fpp fpp --host-audio -v -rA "@$PWD/device-tests.txt"

      - name: Start them again
        if: always() && env.RESTART_SERVICES != ''
        run: |
          for s in $RESTART_SERVICES; do sudo systemctl start $s; done

      - name: Measure the coverage
        if: always()
        run: |
          if [ -d "gcov$PWD/fpp" ]; then
            sudo cp -a "gcov$PWD/fpp/." fpp/
          fi
          python3 -m venv /tmp/gcovr-$$ && /tmp/gcovr-$$/bin/pip install -q gcovr==7.2
          sudo env "PATH=/tmp/gcovr-$$/bin:$PATH" sh scripts/coverage-report.sh "$PWD/fpp" "$PWD/artifacts/coverage" || true
          rm -rf /tmp/gcovr-$$

      # run-local.sh and the report ran as root, so their files are root's.
      - name: Make the artifacts readable
        if: always()
        run: |
          mkdir -p artifacts
          # gcov/ only once a run wrote counts: a missing one would fail the
          # chown, and the step with it, before meta.json is written
          dirs="artifacts fpp"
          [ -d gcov ] && dirs="$dirs gcov"
          sudo chown -R "$(id -u):$(id -g)" $dirs
          chmod -R u+rwX artifacts
          version=$(git -C fpp describe --tags --match='[0-9]*' 2>/dev/null || git -C fpp rev-parse --short HEAD)
          printf '{"flavor":"%s","version":"%s","sha":"%s"}\n' "${{ matrix.device }}" "$version" \
            "$(git -C fpp rev-parse HEAD)" > artifacts/meta.json
          cp fpp/src/build.log artifacts/ 2>/dev/null || true

      - name: Upload failed scenarios
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-scenarios-${{ matrix.device }}
          path: |
            artifacts/
            !artifacts/coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Summarize
        if: always()
        run: python3 scripts/ci-summary.py artifacts >> "$GITHUB_STEP_SUMMARY"

      # Its counters, for the coverage merge in the results job.
      - name: Upload the coverage counts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shard-coverage-device-${{ matrix.device }}
          # Two paths, so the artifact keeps coverage/ as the shards' do.
          path: |
            artifacts/meta.json
            artifacts/coverage/coverage.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-${{ matrix.device }}
          path: |
            artifacts/meta.json
            artifacts/junit.xml
          if-no-files-found: ignore
          retention-days: 14

  # The AM335x scenarios (scenarios/test_am335x_*.py, and the BeagleBone LED
  # step, test_fppinit_bb_leds.py) on a
  # BeagleBone Black and an original PocketBeagle: the PRU outputs and loader
  # against fakepruss, the pinmux, the boot. The boards are too small for
  # runners of their own, so one runner elsewhere drives each over ssh in
  # turn (scripts/remote-device.sh; each board's host is in the runner's
  # .env). A coverage build, as the device job's, through nocc.
  # Self-hosted, as the device job.
  am335x:
    if: github.event_name == 'schedule' || github.event.inputs.device == 'true'
    strategy:
      fail-fast: false
      matrix:
        board: [bbb, pb1]
    runs-on:
      group: Devices
      labels: [self-hosted, am335x]
    timeout-minutes: 120
    concurrency:
      group: device-am335x-${{ matrix.board }}
      cancel-in-progress: false
    env:
      FPP_REF: ${{ github.event.inputs.fpp_ref || 'master' }}
    steps:
      - name: Checkout fpp-tests
        uses: actions/checkout@v6

      - name: Pick the scenarios
        id: pick
        run: |
          ls scenarios/test_am335x_*.py scenarios/test_fppinit_bb_leds.py > am335x-tests.txt 2>/dev/null || true
          echo "count=$(wc -l < am335x-tests.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          [ -s am335x-tests.txt ] || echo "::notice::no AM335x scenarios in this checkout"

      - name: Run the scenarios
        if: steps.pick.outputs.count != '0'
        env:
          DEVICE_BOARD: ${{ matrix.board }}
          DEVICE_FLAVOR: am335x-${{ matrix.board }}
        run: scripts/remote-device.sh "$FPP_REF" coverage -v -rA $(cat am335x-tests.txt)

      - name: Upload failed scenarios
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-scenarios-am335x-${{ matrix.board }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Summarize
        if: always() && steps.pick.outputs.count != '0'
        run: python3 scripts/ci-summary.py artifacts >> "$GITHUB_STEP_SUMMARY"

      # Its counters, for the coverage merge in the results job.
      - name: Upload the coverage counts
        if: always() && steps.pick.outputs.count != '0'
        uses: actions/upload-artifact@v7
        with:
          name: shard-coverage-device-am335x-${{ matrix.board }}
          # Two paths, so the artifact keeps coverage/ as the shards' do.
          path: |
            artifacts/meta.json
            artifacts/coverage/coverage.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the results
        if: always() && steps.pick.outputs.count != '0'
        uses: actions/upload-artifact@v7
        with:
          name: results-am335x-${{ matrix.board }}
          path: |
            artifacts/meta.json
            artifacts/junit.xml
          if-no-files-found: ignore
          retention-days: 14

  # A flavor's shards, put back together as one results-<flavor>: what the
  # dashboard reads. A shard that never finished leaves the flavor failed.
  # Coverage also takes the devices' counters, when they ran.
  results:
    needs: [scenarios, device, am335x]
    if: always() && needs.scenarios.result != 'skipped'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON(github.event_name == 'schedule' && '["asan","tsan","coverage"]' || format('["{0}"]', github.event.inputs.flavor || 'asan')) }}
    env:
      FLAVOR: ${{ matrix.flavor }}
      SHARDS: ${{ (github.event.inputs.pytest_args != '' && github.event.inputs.pytest_args != null) && '1' || '4' }}
    steps:
      - name: Checkout fpp-tests
        uses: actions/checkout@v6

      - name: Download the shards
        uses: actions/download-artifact@v8
        with:
          pattern: shard-${{ matrix.flavor }}-*
          path: shards

      - name: Merge them
        run: |
          mkdir -p artifacts/coverage
          set --
          for i in $(seq 1 "$SHARDS"); do set -- "$@" "shards/shard-$FLAVOR-$i/junit.xml"; done
          status=0
          python3 scripts/merge-junit.py artifacts/junit.xml "$@" || status=$?
          meta=$(ls shards/shard-"$FLAVOR"-*/meta.json 2>/dev/null | head -1)
          [ -n "$meta" ] && cp "$meta" artifacts/meta.json
          [ -f "shards/shard-$FLAVOR-1/coverage/totals.json" ] && cp "shards/shard-$FLAVOR-1/coverage/totals.json" artifacts/coverage/
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # The fpp commit the shards built (master may have moved since).
          [ -f artifacts/meta.json ] && python3 -c 'import json; print("sha=" + json.load(open("artifacts/meta.json"))["sha"])' >> "$GITHUB_OUTPUT"
        id: merge

      # Coverage: the shards' counts, merged into one report. gcovr is the
      # image's version (Debian's), and the per-line pages read fpp's source
      # at the commit the shards built.
      - name: Checkout fpp
        if: env.FLAVOR == 'coverage' && env.SHARDS != '1' && steps.merge.outputs.sha != ''
        uses: actions/checkout@v6
        with:
          repository: FalconChristmas/fpp
          ref: ${{ steps.merge.outputs.sha }}
          path: fpp

      - name: Merge the coverage
        id: coverage
        if: env.FLAVOR == 'coverage' && env.SHARDS != '1' && steps.merge.outputs.sha != ''
        run: |
          python3 -m venv /tmp/gcovr && /tmp/gcovr/bin/pip install -q gcovr==7.2
          PATH=/tmp/gcovr/bin:$PATH sh scripts/coverage-report.sh "$PWD/fpp" "$PWD/artifacts/coverage" \
              shards/shard-coverage-*/coverage/coverage.json

      - name: Upload the coverage report
        id: report
        if: env.FLAVOR == 'coverage' && env.SHARDS != '1'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: artifacts/coverage/
          if-no-files-found: ignore
          retention-days: 30

      - name: Summarize
        if: always()
        run: |
          python3 scripts/ci-summary.py artifacts "${{ steps.report.outputs.artifact-url }}" >> "$GITHUB_STEP_SUMMARY"
          exit "${{ steps.merge.outputs.status }}"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-${{ env.FLAVOR }}
          path: |
            artifacts/meta.json
            artifacts/junit.xml
            artifacts/coverage/totals.json
          if-no-files-found: ignore
          retention-days: 14

  # The web UI suite (web/, run-web.sh): fpp's pages served from Docker as on a
  # player, with the ASan fppd behind them, driven by Playwright from the
  # runner. A dispatched flavor is the fppd behind the pages, except coverage,
  # which has no web counterpart and runs it with ASan (so a hand-published
  # dashboard still gets the web column).
  web:
    if: github.event.inputs.suites != 'scenarios'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FPP_REF: ${{ github.event.inputs.fpp_ref || github.event.client_payload.ref || 'master' }}
      FLAVOR: ${{ github.event.inputs.flavor != '' && github.event.inputs.flavor != 'coverage' && github.event.inputs.flavor || 'asan' }}
    steps:
      - name: Checkout fpp-tests
        uses: actions/checkout@v6

      - name: Checkout fpp
        uses: actions/checkout@v6
        with:
          repository: FalconChristmas/fpp
          ref: ${{ env.FPP_REF }}
          path: fpp
          fetch-depth: 0
          filter: blob:none

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-web-${{ env.FLAVOR }}-${{ github.run_id }}
          restore-keys: |
            ccache-web-${{ env.FLAVOR }}-
            ccache-${{ env.FLAVOR }}-

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the suite and Chromium
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Build fpp, serve the UI and run the suite
        env:
          FPP_TESTS_CCACHE: .ccache
          PLAYWRIGHT_ARGS: ${{ github.event.inputs.playwright_args }}
          NOPCH: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.fpp_ref == 'master') && '--nopch' || '' }}
        # PLAYWRIGHT_ARGS is left unquoted on purpose, to split into arguments.
        run: ./run-web.sh --fpp fpp --ref HEAD --flavor "$FLAVOR" $NOPCH $PLAYWRIGHT_ARGS

      # meta.json's flavor is the dashboard's column for this suite.
      - name: Make the artifacts readable
        if: always()
        run: |
          mkdir -p artifacts/web
          sudo chown -R "$(id -u):$(id -g)" artifacts && chmod -R u+rwX artifacts
          version=$(git -C fpp describe --tags --match='[0-9]*' 2>/dev/null || git -C fpp rev-parse --short HEAD)
          printf '{"flavor":"web","fppd":"%s","version":"%s","sha":"%s"}\n' "$FLAVOR" "$version" \
            "$(git -C fpp rev-parse HEAD)" > artifacts/web/meta.json

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-report
          path: artifacts/web/
          if-no-files-found: ignore
          retention-days: 14

      - name: Summarize
        if: always()
        run: python3 scripts/ci-summary.py artifacts/web >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-web
          path: |
            artifacts/web/meta.json
            artifacts/web/junit.xml
          if-no-files-found: ignore
          retention-days: 14

  # The dashboard on GitHub Pages: the test counts and coverage of every run
  # so far (history.json, carried over from the live site each time) and the
  # latest coverage report, line by line. Each deploy replaces the whole site,
  # so only a run with a coverage build publishes by hand.
  publish:
    needs: [results, web, am335x]
    if: always() && !cancelled() && (github.event_name == 'schedule' || (github.event.inputs.publish == 'true' && github.event.inputs.fpp_ref == 'master' && github.event.inputs.flavor == 'coverage'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Checkout fpp-tests
        uses: actions/checkout@v6

      - name: Download the results
        uses: actions/download-artifact@v8
        with:
          pattern: results-*
          path: results

      - name: Download the coverage report
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: coverage-report
          path: site/coverage

      - name: Build the dashboard
        run: |
          curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/history.json" \
            -o history.json || echo "no published history yet"
          python3 scripts/build-site.py results site history.json \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          rm -f site/coverage/coverage.json

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5
