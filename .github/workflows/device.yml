name: Device

# The scenarios on a real device, through run-local.sh: the ones the Docker
# runs skip. On a Raspberry Pi 5: Pi-only fppinit and cape detection, DPI
# pixels, the framebuffer and KMS outputs, GPIO, the serial console, the real
# sound card (--host-audio). On an AM62x BeagleBone: the BB64 cape detection,
# its PRU outputs against FAKE_PRU, GPIO, the cape's sound card. The nightly
# runs them as part of the Scenarios workflow (its device job); this is for a
# run by hand: the tests a Docker run's ASan skipped
# (scripts/device-tests.py), or the whole suite, which takes hours, in any
# flavor.
#
# This runs on a self-hosted runner in the org's Devices group, where a job is
# root on the device (run-local.sh needs it); each runner carries its
# device's label. So there is no pull_request trigger: only the schedule and
# a run by hand reach it.

on:
  workflow_dispatch:
    inputs:
      device:
        description: Which device
        type: choice
        options: [pi5, am62x, am335x-bbb, am335x-pb1]
        default: pi5
      tests:
        description: Which scenarios (device = the ones the last Docker nightly skipped)
        type: choice
        options: [device, all]
        default: device
      docker_run:
        description: The Docker Scenarios run whose skipped tests to take (default the last scheduled one)
        default: ""
      fpp_ref:
        description: fpp branch, tag or commit to test
        default: master
      flavor:
        description: Build flavor (ASan doesn't run on the Pi's 39-bit kernel)
        type: choice
        options: [debug, optimized, tsan]
        default: debug
      host_audio:
        description: Play media through the device's sound card (run-local.sh --host-audio)
        type: boolean
        default: true
      pytest_args:
        description: Extra pytest arguments (e.g. -k presets)
        default: ""

permissions:
  contents: read
  # to fetch the Docker run's results
  actions: read

jobs:
  device:
    if: ${{ !startsWith(github.event.inputs.device, 'am335x') }}
    runs-on:
      group: Devices
      labels: [self-hosted, Linux, ARM64, "${{ github.event.inputs.device || 'pi5' }}"]
    timeout-minutes: 240
    # One run at a time on a device, this workflow's or the nightly's.
    concurrency:
      group: device-${{ github.event.inputs.device || 'pi5' }}
      cancel-in-progress: false
    env:
      DEVICE: ${{ github.event.inputs.device || 'pi5' }}
      FLAVOR: ${{ github.event.inputs.flavor || 'debug' }}
      ALL_TESTS: ${{ github.event.inputs.tests == 'all' && '1' || '' }}
    steps:
      # run-local.sh runs as root; anything of root's left in the workspace
      # (a crashed run's files) would stop the checkout from cleaning it.
      - name: Give the workspace back to the runner
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" || true

      - name: Checkout fpp-tests
        uses: actions/checkout@v6

      # The Docker run whose skipped tests this one runs: the nightly that
      # triggered it, or for a run by hand the last scheduled nightly.
      - name: Find the Docker run
        id: docker
        if: env.ALL_TESTS != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER: ${{ github.event.inputs.docker_run }}
        run: |
          id="$TRIGGER"
          if [ -z "$id" ]; then
            id=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/scenarios.yml/runs?event=schedule&status=completed&per_page=1" |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["workflow_runs"][0]["id"])')
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Download its ASan results
        if: env.ALL_TESTS != '1'
        uses: actions/download-artifact@v8
        with:
          name: results-asan
          path: docker-results
          run-id: ${{ steps.docker.outputs.id }}
          github-token: ${{ github.token }}

      - name: Pick the scenarios
        id: pick
        run: |
          if [ "$ALL_TESTS" = 1 ]; then
            echo "ref=${{ github.event.inputs.fpp_ref || 'master' }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/device-tests.py docker-results/junit.xml > device-tests.txt
          echo "$(wc -l < device-tests.txt) scenarios the Docker run skipped"
          # The fpp commit that run built, unless a run by hand names one.
          ref="${{ github.event.inputs.fpp_ref }}"
          [ -n "$ref" ] || ref=$(python3 -c 'import json; print(json.load(open("docker-results/meta.json"))["sha"])')
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout fpp
        uses: actions/checkout@v6
        with:
          repository: FalconChristmas/fpp
          ref: ${{ steps.pick.outputs.ref }}
          path: fpp
          fetch-depth: 0
          filter: blob:none
          # A device build needs them (RGBMatrix, RF24, spixels), and make -j
          # left to fetch them itself races two clones of one submodule.
          submodules: recursive

      # The checkout cleans the tree each night; ccache (the runner user's
      # own, which outlives the runs) makes the rebuild cheap. Hash paths
      # relative to the tree, as build-fpp.sh does.
      - name: Build fpp
        working-directory: fpp/src
        env:
          CCACHE: ccache
          CCACHE_BASEDIR: ${{ github.workspace }}/fpp
          CCACHE_NOHASHDIR: "1"
        run: ../../scripts/device-make.sh "$FLAVOR"

      # The run has the device to itself: the device's own fppd holds its
      # outputs' GPIO lines (a cape's string pins, which the BB output
      # scenarios drive) and fppoled the cape buttons' (test_gpio_pins).
      # Started again at the end, however the job ends.
      - name: Stop the device's fppd and fppoled
        run: |
          restart=
          for s in fppd fppoled; do
            if systemctl is-active --quiet $s; then
              sudo systemctl stop $s
              restart="$restart $s"
            fi
          done
          echo "RESTART_SERVICES=$restart" >> "$GITHUB_ENV"

      - name: Run the scenarios
        env:
          HOST_AUDIO: ${{ github.event.inputs.host_audio == 'true' && '--host-audio' || '' }}
          PYTEST_ARGS: ${{ github.event.inputs.pytest_args }}
          # On the AM62x board the scenarios that drive the real PRUs take a
          # second pass (scripts/device-scenarios.sh).
          HOST_PRU: ${{ github.event.inputs.device == 'am62x' && '1' || '' }}
        # HOST_AUDIO and PYTEST_ARGS are left unquoted on purpose, to split
        # into arguments. The node ids go in a file (pytest's @file), one per
        # line, since some carry spaces in their parameters.
        run: |
          TESTS=
          [ -f device-tests.txt ] && TESTS="@$PWD/device-tests.txt"
          # No bytecode: as root it lands in scenarios/__pycache__, which the
          # runner then cannot remove.
          sudo env PYTHONDONTWRITEBYTECODE=1 HOST_PRU="$HOST_PRU" scripts/device-scenarios.sh --fpp fpp $HOST_AUDIO -v -rA $PYTEST_ARGS ${TESTS:+"$TESTS"}

      - name: Start them again
        if: always() && env.RESTART_SERVICES != ''
        run: |
          for s in $RESTART_SERVICES; do sudo systemctl start $s; done

      # run-local.sh runs as root, so its artifacts are root's.
      - name: Make the artifacts readable
        if: always()
        run: |
          mkdir -p artifacts
          sudo chown -R "$(id -u):$(id -g)" artifacts && chmod -R u+rwX artifacts
          version=$(git -C fpp describe --tags --match='[0-9]*' 2>/dev/null || git -C fpp rev-parse --short HEAD)
          printf '{"flavor":"%s-%s","version":"%s","sha":"%s"}\n' "$DEVICE" "$FLAVOR" "$version" \
            "$(git -C fpp rev-parse HEAD)" > artifacts/meta.json
          cp fpp/src/build.log artifacts/ 2>/dev/null || true

      - name: Upload failed scenarios
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-scenarios-${{ env.DEVICE }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Summarize
        if: always()
        run: python3 scripts/ci-summary.py artifacts >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-${{ env.DEVICE }}
          path: |
            artifacts/meta.json
            artifacts/junit.xml
          if-no-files-found: ignore
          retention-days: 14

  # The AM335x scenarios (only those: the tests input doesn't apply) on a
  # BeagleBone Black or an original PocketBeagle, driven over ssh from a
  # runner elsewhere, as the nightly's am335x job does
  # (scripts/remote-device.sh).
  am335x:
    if: startsWith(github.event.inputs.device, 'am335x')
    runs-on:
      group: Devices
      labels: [self-hosted, am335x]
    timeout-minutes: 240
    concurrency:
      group: device-${{ github.event.inputs.device }}
      cancel-in-progress: false
    env:
      DEVICE_BOARD: ${{ github.event.inputs.device == 'am335x-pb1' && 'pb1' || 'bbb' }}
      DEVICE_FLAVOR: ${{ github.event.inputs.device }}-${{ github.event.inputs.flavor }}
    steps:
      - name: Checkout fpp-tests
        uses: actions/checkout@v6

      - name: Run the scenarios
        env:
          FPP_REF: ${{ github.event.inputs.fpp_ref }}
          FLAVOR: ${{ github.event.inputs.flavor }}
          PYTEST_ARGS: ${{ github.event.inputs.pytest_args }}
        # PYTEST_ARGS and TESTS are left unquoted on purpose, to split into
        # arguments. With no AM335x scenarios checked out, PYTEST_ARGS names
        # what to run.
        run: |
          TESTS=$(ls scenarios/test_am335x_*.py 2>/dev/null || true)
          scripts/remote-device.sh "$FPP_REF" "$FLAVOR" -v -rA $PYTEST_ARGS $TESTS

      - name: Upload failed scenarios
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-scenarios-${{ github.event.inputs.device }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Summarize
        if: always()
        run: python3 scripts/ci-summary.py artifacts >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-${{ github.event.inputs.device }}
          path: |
            artifacts/meta.json
            artifacts/junit.xml
          if-no-files-found: ignore
          retention-days: 14
