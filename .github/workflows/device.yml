name: Device

# The scenarios on a real Raspberry Pi 5, through run-local.sh: the ones the
# Docker runs skip -- Pi-only fppinit and cape detection, DPI pixels, the
# framebuffer and KMS outputs, GPIO, the serial console, the real sound card
# (--host-audio). Exactly those: the nightly runs after the Docker one and
# takes the tests its ASan run skipped (scripts/device-tests.py), on the fpp
# commit that run built. The whole suite on a device takes hours; a run by
# hand can still ask for it.
#
# This runs on a self-hosted runner in the org's Devices group, where a job is
# root on the device (run-local.sh needs it). So there is no pull_request
# trigger: only the schedule and a run by hand reach it.

on:
  # After the Docker nightly (07:00 UTC). --host-audio plays through the
  # device's sound card; this is the middle of the night in the US.
  workflow_run:
    workflows: [Scenarios]
    types: [completed]
  workflow_dispatch:
    inputs:
      tests:
        description: Which scenarios (device = the ones the last Docker nightly skipped)
        type: choice
        options: [device, all]
        default: device
      docker_run:
        description: The Docker Scenarios run whose skipped tests to take (default the last scheduled one)
        default: ""
      fpp_ref:
        description: fpp branch, tag or commit to test
        default: master
      flavor:
        description: Build flavor (ASan doesn't run on the Pi's 39-bit kernel)
        type: choice
        options: [debug, optimized, tsan]
        default: debug
      host_audio:
        description: Play media through the device's sound card (run-local.sh --host-audio)
        type: boolean
        default: true
      pytest_args:
        description: Extra pytest arguments (e.g. -k presets)
        default: ""

concurrency:
  group: device
  cancel-in-progress: false

permissions:
  contents: read
  # to fetch the Docker run's results
  actions: read

jobs:
  pi5:
    # Only after the scheduled Docker nightly, not every dispatch of it.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'schedule'
    runs-on:
      group: Devices
      labels: [self-hosted, Linux, ARM64]
    timeout-minutes: 240
    env:
      FLAVOR: ${{ github.event.inputs.flavor || 'debug' }}
      ALL_TESTS: ${{ github.event.inputs.tests == 'all' && '1' || '' }}
    steps:
      # run-local.sh runs as root; anything of root's left in the workspace
      # (a crashed run's files) would stop the checkout from cleaning it.
      - name: Give the workspace back to the runner
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" || true

      - name: Checkout fpp-tests
        uses: actions/checkout@v6

      # The Docker run whose skipped tests this one runs: the nightly that
      # triggered it, or for a run by hand the last scheduled nightly.
      - name: Find the Docker run
        id: docker
        if: env.ALL_TESTS != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER: ${{ github.event.workflow_run.id || github.event.inputs.docker_run }}
        run: |
          id="$TRIGGER"
          if [ -z "$id" ]; then
            id=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/scenarios.yml/runs?event=schedule&status=completed&per_page=1" |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["workflow_runs"][0]["id"])')
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Download its ASan results
        if: env.ALL_TESTS != '1'
        uses: actions/download-artifact@v8
        with:
          name: results-asan
          path: docker-results
          run-id: ${{ steps.docker.outputs.id }}
          github-token: ${{ github.token }}

      - name: Pick the scenarios
        id: pick
        run: |
          if [ "$ALL_TESTS" = 1 ]; then
            echo "ref=${{ github.event.inputs.fpp_ref || 'master' }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/device-tests.py docker-results/junit.xml > device-tests.txt
          echo "$(wc -l < device-tests.txt) scenarios the Docker run skipped"
          # The fpp commit that run built, unless a run by hand names one.
          ref="${{ github.event.inputs.fpp_ref }}"
          [ -n "$ref" ] || ref=$(python3 -c 'import json; print(json.load(open("docker-results/meta.json"))["sha"])')
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout fpp
        uses: actions/checkout@v6
        with:
          repository: FalconChristmas/fpp
          ref: ${{ steps.pick.outputs.ref }}
          path: fpp
          fetch-depth: 0
          filter: blob:none
          # A device build needs them (RGBMatrix, RF24, spixels), and make -j
          # left to fetch them itself races two clones of one submodule.
          submodules: recursive

      # The checkout cleans the tree each night; ccache (the runner user's
      # own, which outlives the runs) makes the rebuild cheap. Hash paths
      # relative to the tree, as build-fpp.sh does.
      - name: Build fpp
        working-directory: fpp/src
        env:
          CCACHE: ccache
          CCACHE_BASEDIR: ${{ github.workspace }}/fpp
          CCACHE_NOHASHDIR: "1"
        run: |
          if ! make -j"$(nproc)" "$FLAVOR" > build.log 2>&1; then
            grep -E "error|Error" build.log | tail -40
            exit 1
          fi

      # fppoled holds the cape buttons' GPIO lines, which test_gpio_pins
      # drives. Started again at the end, however the job ends.
      - name: Stop fppoled
        run: |
          if systemctl is-active --quiet fppoled; then
            sudo systemctl stop fppoled
            echo "RESTART_FPPOLED=1" >> "$GITHUB_ENV"
          fi

      - name: Run the scenarios
        env:
          HOST_AUDIO: ${{ (github.event_name == 'workflow_run' || github.event.inputs.host_audio == 'true') && '--host-audio' || '' }}
          PYTEST_ARGS: ${{ github.event.inputs.pytest_args }}
        # HOST_AUDIO, PYTEST_ARGS and TESTS are left unquoted on purpose, to
        # split into arguments.
        run: |
          TESTS=
          [ -f device-tests.txt ] && TESTS=$(cat device-tests.txt)
          # No bytecode: as root it lands in scenarios/__pycache__, which the
          # runner then cannot remove.
          sudo env PYTHONDONTWRITEBYTECODE=1 ./run-local.sh --fpp fpp $HOST_AUDIO -v -rA --junitxml=artifacts/junit.xml $PYTEST_ARGS $TESTS

      - name: Start fppoled again
        if: always() && env.RESTART_FPPOLED == '1'
        run: sudo systemctl start fppoled

      # run-local.sh runs as root, so its artifacts are root's.
      - name: Make the artifacts readable
        if: always()
        run: |
          mkdir -p artifacts
          sudo chown -R "$(id -u):$(id -g)" artifacts && chmod -R u+rwX artifacts
          version=$(git -C fpp describe --tags --match='[0-9]*' 2>/dev/null || git -C fpp rev-parse --short HEAD)
          printf '{"flavor":"pi5-%s","version":"%s","sha":"%s"}\n' "$FLAVOR" "$version" \
            "$(git -C fpp rev-parse HEAD)" > artifacts/meta.json
          cp fpp/src/build.log artifacts/ 2>/dev/null || true

      - name: Upload failed scenarios
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-scenarios-pi5
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Summarize
        if: always()
        run: python3 scripts/ci-summary.py artifacts >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-pi5
          path: |
            artifacts/meta.json
            artifacts/junit.xml
          if-no-files-found: ignore
          retention-days: 14
